<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phrases App</title>
  <link rel="stylesheet" href="savedPhrases.css">
</head>
<body>
  
  <header class="search-bar">
    <input type="text" placeholder="Search">
    <button class="sort-btn">Sort</button>
    <button class="mic-btn"><img class="microphone" src="microphone.png" alt=""></button>
  </header>

  
  <main>
    <h2>Stored Phrases</h2>
    <ul class="phrase-list">
      <li class="phrase-item">
        
        <div class="phrase-text">
            <span class="star">⭐</span>
          “Hi, my name is Patric.”
          <button class="play">▶</button>
          <div class="date">1/12/2025</div>
        </div>
      </li>
      <li class="phrase-item">
        
        <div class="phrase-text">
            <span class="star">⭐</span>
          “I am deaf / hard of hearing.”
          <button class="play">▶</button>
          <div class="date">1/11/2024</div>
        </div>

      </li>
      <li class="phrase-item">
        <div class="phrase-text">
            <span class="star">⭐</span>
          “Can you please write it down?”
              <button class="play">▶</button>
          <div class="date">23/02/2025</div>
        </div>

      </li>
      <li class="phrase-item">
        <div class="phrase-text">
            <span class="star">⭐</span>
          “Where is the restroom?”
                  <button class="play">▶</button>
          <div class="date">21/03/2025</div>
        </div>

      </li>
      <li class="phrase-item">
        <div class="phrase-text">
            <span class="star">⭐</span>
          “Nice to meet you!”
                  <button class="play">▶</button>
          <div class="date">11/04/2025</div>
        </div>

      </li>
    </ul>
  </main>

  <nav class="bottom-nav">
    <img src="folder-icon.svg" alt="">
    <img class="main-btn" src="camera-icon.svg" alt="" href="#">
    <img src="user-icon.svg" alt="">
  </nav>
</body>
</html>
